<!DOCTYPE html>
<html lang="en">
<head>
    <title>style</title>
    <style>
        h2{color: black; background-color: blueviolet;}
        h3{color:aquamarine; background-color: black;}
    .khoi1{background-color: red;}
    .khoi2{background-color: green;
    /*khi có 2 px thì giá trị đầu tiên chính là trên dưới giá trị 2 là trái phải*/
    /* 4 giá trị: thứ tự trên phải dưới trái*/
           margin:50px 200px 50px 200px}
    .khoi3{background-color: yellow;
    padding: 10px 50px 100px 200px;}
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="khoi1">khoi1</div>
<div class="khoi2">khoi2</div>
<div class="khoi3">khoi3</div>









<!--cách 1: Inline style-->
<!--color: Quy định màu chữ-->
<!--backgroud-color: Quy định màu nền-->
    <h1 style="color: aqua; background-color: orange;">bài style</h1>
<!--cách 2: Internal Style-->
    <h2>Internal style</h2>
    <h3>Ngô Đức Huy</h3>
<!--cách 3: External style-->
    <h4>cách 3: External style</h4>
<!--nếu là id sử dụng dấu # + tên id-->
<!--nếu là class sử dụng dấu . + tên id-->
<!--ví dụ ở dưới: #tieude-1 -->
    <h1 id="tieude-1">web 2</h1>
    <h1 class="tieude-2">web 3</h1>

    <div>web4</div>
    <div class="web4">web 4</div>

</body>
</html>
