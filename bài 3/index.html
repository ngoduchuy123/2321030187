<html>
    <head>
        <title>bài 3</title>
    </head>
    <body>
    <!--ol danh sách có thứ tự-->
     <ol>
        <li>c#</li>
        <li>java</li>
        <li>python</li>
     </ol>   
    <!--ul danh sách không có thứ thự--> 
     <ul>
        <li>c#</li>
        <li>java</li>
        <li>python</li>
     </ul>   
    <!--form là phần tử chứ các tương tác với người dùng-->
     <h1>Form đăng ký</h1>
     <form>
        <div>
            <b>Họ Và Tên</b><br>
        <!-- nếu input ko có type thì sẽ mặc định là text-->
        <!--thuộc tính readony sử dụng khi không muốn người dùng nhập-->
        <!--thông tin vào input-->
            <input type="text" placeholder="Họ Và Tên">
        </div>
        <div>
            <b>Mật Khẩu</b><br>
            <input type="password" placeholder="Mật Khẩu">
        </div>
        <div>
            <b>năm sinh</b><br>
            <input type="number" placeholder="năm sinh">
        </div>
        <div>
            <b>giới thiệu về bản thân</b><br>
            <textarea>nhập thông tin...</textarea>
        </div>
        <div>
            <b>Email</b><br>
            <input type="email">
        </div>
        <div>
        <!--số đầu tiên : 0-->
        <!--số thứ 2: 3,9,8-->
        <!--8 số còn lại:0-9-->
            <b>Số điện thoại</b><br>
            <input type="tel" pattern="([0]{1}([3,8,9]{1})([0-9]{8}"))>
        </div>
        <div>
            <b>Giới tính</b><br>
            <input type="radio" name="Giới tính" value="nam"> Nam<br>
            <input type="radio" name="Giới tính" value="nữ" > Nữ
        </div>
        <div>
            <b>sở thích</b><br>
            Chơi game: <input type="checkbox" name="sở thích" value="choigame"><br>
            Nghe nhạc: <input type="checkbox" name="sở thích" value="choigame"><br>
            Thể thao: <input type="checkbox" name="sở thích" value="choigame">
        </div>
        <div>
            <b>trình duyệt wed ưa thích</b><br>
            <select name="browsers">
                <option value="interner explorer">interner explorer</option>
                <option value="firefox">firefox</option>
                <option value="chrome">chrome</option>
            </select>
        </div>
        <!--0 <input type="range" id="a" value="50">"100">-->
        <div>
            <input type="submit">
        </div>
    </form>
    </body>
</html>
